{% extends "base.html" %}
{% block title %}Cases - LexGuard{% endblock %}
{% block content %}
<div class="header-box"><h1>Cases</h1></div>

<div class="card">
    <h2 style="margin-top:0;">New Case</h2>
    <form method="post" action="/cases/new"><input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Case ID</label>
        <input type="text" name="case_id" required>
        <label>Case Name</label>
        <input type="text" name="case_name" required>
        <label>Description</label>
        <textarea name="description" rows="2"></textarea>
        <label>Investigator</label>
        <input type="text" name="investigator">
        <label>Priority</label>
        <select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        <button type="submit">Create Case</button>
    </form>
</div>

<div class="card">
    <table>
        <thead><tr><th>Case ID</th><th>Name</th><th>Investigator</th><th>Priority</th><th>Status</th><th></th></tr></thead>
        <tbody>
        {% for c in cases %}
            <tr>
                <td>{{ c[1] }}</td><td>{{ c[2] }}</td><td>{{ c[4] }}</td><td>{{ c[5] }}</td><td>{{ c[6] }}</td>
                <td><a href="/cases/{{ c[1] }}">View →</a></td>
            </tr>
        {% else %}
            <tr><td colspan="6">No cases yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
