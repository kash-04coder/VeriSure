<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Verisure</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container" style="max-width:520px;margin:55px auto;">
    <a class="brand-lockup" href="/" aria-label="Verisure home"><img src="/static/verisure-logo.png" alt="Verisure logo"><span><strong>Verisure</strong><small>Verification + Assurance</small></span></a>
    <div class="header-box" style="margin-top:24px;">
    <p class="eyebrow">AICTE REGULATION WORKSPACE</p>
    <h1>Sign in to your workspace</h1>
    <p>Access is based on your assigned role and institution scope.</p>
    {% for message in messages %}
    <div class="notice {{ 'error' if message.type == 'error' else 'success' }}">{{ message.text }}</div>
    {% endfor %}
    <form method="post" action="/login">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button class="button primary auth-submit" type="submit">Sign in</button>
    </form>
    <div class="info"><strong>Prototype built for SIH 2026</strong><p>Synthetic records and simulated bank verification only.</p></div>
    </div>
</main>
</body>
</html>
