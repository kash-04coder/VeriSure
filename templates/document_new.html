{% extends "base.html" %}
{% block title %}New Document - LexGuard{% endblock %}
{% block content %}
<div class="header-box">
    <h1>Register New Document</h1>
    <p>This creates version 1 and the first block of its integrity chain</p>
</div>
<div class="card" style="max-width:600px;">
    <form method="post" action="/documents/new" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Case ID</label>
        <input type="text" name="case_id" placeholder="e.g. CASE-001" required>

        <label>Document Type</label>
        <select name="doc_type">
            {% for t in doc_types %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Title</label>
        <input type="text" name="title" required>

        <label>Description</label>
        <textarea name="description" rows="3"></textarea>

        <label>File</label>
        <input type="file" name="file" required>

        <button type="submit">Create Document</button>
    </form>
</div>
{% endblock %}
